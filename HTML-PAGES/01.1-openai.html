<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>OpenRouter API in Browser</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">
   <link rel="stylesheet" href="01-style.css">
   <script src="config.js"></script>
</head>

<body>
   <h1>OpenRouter API in Browser</h1>

   <input type="text" id="apiKey" placeholder="Enter your OpenRouter API key" value="" autocomplete="off"
      data-form-type="other">
   <input type="text" id="prompt" placeholder="Enter your prompt" value="Capital of England?">

   <button id="sendBtn" type="submit">Send Request</button>

   <br>
   <div id="result"></div>

   <script>

      // Pre-fill the API key from config.js (OpenRouter) so the demo works out of the box.
      if (typeof OPENROUTER_API_KEY !== 'undefined' && OPENROUTER_API_KEY) {
         document.getElementById('apiKey').value = OPENROUTER_API_KEY;
      }

      document.getElementById('sendBtn').addEventListener('click', async () => {
         await window.openRouterReady; // key + model come from OPENROUTER.txt
         // Use the key typed into the field, falling back to the key from OPENROUTER.txt.
         const apiKey = document.getElementById('apiKey').value || OPENROUTER_API_KEY;
         const prompt = document.getElementById('prompt').value;
         const resultDiv = document.getElementById('result');


         if (!apiKey) {
            resultDiv.innerHTML = '<p style="color: red;">Please enter your API key</p>';
            return;
         }

         resultDiv.innerHTML = '<p>Loading...</p>';
         system_prompt = `
         You are a helpful assistant. You always answer in a concise manner. 

         You never refuse to answer but do not make things up - just say 'I don't know'. You always try to help the user as much as possible. 

         Convert markdown to HTML when needed so that ouput is properly formatted. Ensure there is a new line after each sentence.`;

         // ******************** AI BIT ********************
         try {
            const response = await fetch(OPENROUTER_API_URL, {
               method: 'POST',
               headers: {
                  'Content-Type': 'application/json', // Tells the server we're sending JSON data.
                  'Authorization': `Bearer ${apiKey}`, // Authenticates our request using the OpenRouter API key.
                  ...OPENROUTER_HEADERS // Optional OpenRouter attribution headers.
               },
               body: JSON.stringify({
                  model: OPENROUTER_MODEL, // OpenRouter model id (from OPENROUTER.txt, e.g. 'deepseek-v4.1-flash').
                  messages: [
                     { role: 'system', content: system_prompt }, // Defines how the AI agent should behave (its "personality" and rules).
                     { role: 'user', content: prompt } // The user's input/query for the agent to respond to.
                  ], // Models are trained to understand these roles to generate appropriate responses so we use the same format.

                  max_tokens: 1024, // Limits the response length to prevent excessive output. A token in LLM (Large Language Model) terminology is the basic unit of text that the model processes. Think of it as the fundamental "chunk" that the AI reads and generates. You can typically estimate roughly 1 token ≈ 4 characters or 0.75 words in English, though this varies significantly based on the text.

                  temperature: 0.7 // Controls randomness: 0.0 = very predictable/deterministic, 2.0 = very creative/random. 0.7 provides a good balance for natural, varied responses without being too unpredictable. !!! We will look at TEMPERATURE in another video...
               })
            });

            const data = await response.json();
            console.log('API Response:', data);

            // ******************** AI BIT ********************

            // NB No mememory every call is stateless
            let output = "";

            if (data.error) {
               // OpenRouter error responses (bad key, bad model, rate limit...) have NO `choices`.
               resultDiv.innerHTML = `<p style="color: red;">Error: ${data.error.message}</p>`;
            } else if (!data.choices || !data.choices[0]) {
               resultDiv.innerHTML = `<p style="color: red;">Unexpected response from OpenRouter (no choices). Check the console.</p>`;
            } else {
               const msg = data.choices[0].message.content; // We can drill down for the content of the first message choice to get the 'answer'.
               resultDiv.innerHTML = `<p><strong>Response:</strong></p><p>${output + '<br>' + msg}</p>`;
            }
         } catch (error) {
            resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
         }
      });
   </script>
</body>

</html>
